<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SoulSensei Check-in</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#2e0a16;--ink:#faebf6;--mute:#c9a9bd;--line:rgba(250,235,246,.16);--grad:linear-gradient(135deg,#c13fa8,#6d1b80);--red:#e5484d;--green:#2fb36b;--amber:#e8a33d}
@media(prefers-color-scheme:dark){:root{color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg) url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASMAAABwCAIAAADaL4GXAAAA/klEQVR42u3TQQ0AIBDAsMHzBCAD//JQwa+VsGTrzgn4bEsATgOnAU4Dp4HTAKeB0wCngdPAaYDTwGmA08Bp4DTAaeA0cBrgNHAa4DRwGjgNcBo4DXAaOA2cBjgNnAY4DZwGTgOcBk4DpwFOA6cBTgOngdMAp4HTAKeB08BpgNPAaeA0wGngNMBp4DRwGuA0cBrgNHAaOA1wGjgNcBo4DZwGOA2cBk4DnAZOA5wGTgOnAU4DpwFOA6eB0wCngdMAp4HTwGmA08Bp4DTAaeA0wGngNHAa4DRwGuA0cBo4DXAaOA2cBjgNnAY4DZwGTgOcBk4DnAZOA6cBTgOnAVU9Wc8BLqGW0TUAAAAASUVORK5CYII=);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr{max-width:460px;margin:0 auto;padding:28px 20px}.scr[hidden]{display:none}
.logo{display:block;width:230px;max-width:70%;margin:0 auto 26px}
.panel{background:rgba(20,4,10,.55);border:1px solid var(--line);border-radius:18px;padding:24px}
h1{font-size:20px;margin:0 0 18px;font-weight:700}
input,select{width:100%;padding:14px;margin:0 0 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);font:inherit;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--grad);color:#fff;font:inherit;font-weight:700;font-size:16px;margin:0 0 12px;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.err{color:#ff9aa0;min-height:20px;font-size:14px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top img{width:130px}.top button{width:auto;padding:8px 14px;margin:0;font-size:14px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;background:rgba(20,4,10,.55);display:grid;gap:4px}
.card b{font-size:17px}.card small,.card span{color:var(--mute);font-size:14px}
.card.up{cursor:pointer;border-color:var(--red)}.card.done{cursor:default;border-color:var(--green)}
.badge{font-style:normal;justify-self:start;margin-top:8px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.up .badge{background:var(--red)}.done .badge{background:var(--green)}
#reader{width:100%;border-radius:14px;overflow:hidden;margin-bottom:12px}
.res{border-radius:18px;padding:26px 20px;text-align:center;margin-bottom:14px}
.res h1{font-size:26px;margin:0 0 8px}.res p{margin:0 0 14px}
.res.green{background:var(--green)}.res.red{background:var(--red)}.res.amber{background:var(--amber);color:#2a1700}
.pick{display:flex;align-items:center;gap:12px;padding:12px;margin:0 0 8px;border-radius:12px;background:rgba(255,255,255,.6);font-weight:600;cursor:pointer}.pick.was{opacity:.5;cursor:default}.pick input[type=checkbox]{width:24px;height:24px;margin:0;padding:0;accent-color:#6d1b80;flex:none}
.res select{background:#fff;color:#222}
.res button{background:#1b0610}
@media(prefers-reduced-motion:no-preference){.res{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.5}}}
.card{display:flex;gap:14px;align-items:flex-start}.meta{display:grid;gap:4px;min-width:0}
.av{width:60px;height:60px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--line)}.ini{display:grid;place-content:center;background:var(--grad);font-weight:700}
.top2{display:flex;align-items:center;min-height:48px}#home .logo{margin-top:26vh}
#burger{width:48px;height:48px;border-radius:50%;background:#4a1630;border:1px solid var(--line);display:grid;place-content:center;gap:5px;padding:0;margin:0}
#burger span{display:block;width:20px;height:2px;background:#fff;border-radius:2px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}#scrim[hidden]{display:none}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(84vw,340px);background:#2a0916;border-right:1px solid var(--line);border-radius:0 22px 22px 0;z-index:30;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;transform:translateX(-105%);visibility:hidden;transition:transform .22s ease,visibility .22s}
#drawer.open{transform:none;visibility:visible}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;font-size:18px}.dh button{width:40px;height:40px;padding:0;margin:0;border-radius:50%;background:transparent;border:1px solid var(--line);color:var(--ink)}
#drawer nav{flex:1;overflow:auto}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 4px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:15px;text-align:left;margin:0;cursor:default}
.mi i{font-style:normal;color:var(--mute)}
button.host{background:var(--grad);border-radius:12px;padding:14px;margin:10px 0;border:0;cursor:pointer}.host[hidden]{display:none}
.live{background:#fff;color:#6d1b80;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700}
@media(prefers-reduced-motion:reduce){#drawer{transition:none}}
</style></head><body>

const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
function openDrawer(){$('drawer').classList.add('open');$('scrim').hidden=false}
function closeDrawer(){$('drawer').classList.remove('open');$('scrim').hidden=true}
async function load(){const{data,error}=await SB.rpc('my_sessions');if(error)return false;list=data;hosting=data.some(s=>!s.is_completed);$('mi-ck').hidden=!hosting;
 if(!hosting&&['chk','act','scan','code','resv'].some(i=>!$(i).hidden)){await stop();show('home')}return true}
async function home(){show('home');closeDrawer();await load();clearInterval(tmr);tmr=setInterval(load,30000)}
async function openCheckin(){closeDrawer();show('chk');const l=$('list');l.textContent='Loading...';
 if(!await load()){l.textContent='Could not load sessions. Check your connection.';return}
 l.innerHTML='';list.forEach(s=>{const d=document.createElement('div');d.className='card '+(s.is_completed?'done':'up');const ph=PH[s.leader_name];
  d.innerHTML=(ph?`<img class="av" alt="" src="${ph}">`:`<div class="av ini">${esc(ini(s.leader_name||'?'))}</div>`)+`<div class="meta"><b>${esc(s.name)}</b><span>${esc(s.leader_name)}</span><small>${T(s.starts_at,dt)}, ${T(s.starts_at,tm)} to ${T(s.ends_at,tm)}</small><em class="badge">${s.is_completed?'Completed':'Upcoming'}</em></div>`;
  if(!s.is_completed)d.onclick=()=>{cur=s;$('at').textContent=s.name;$('ai').textContent='Check-in is open '+T(s.opens_at,tm)+' to '+T(s.closes_at,tm)+'.';show('act')};
  l.appendChild(d)})}
$('burger').onclick=openDrawer;$('dx').onclick=closeDrawer;$('scrim').onclick=closeDrawer;$('mi-ck').onclick=openCheckin;$('back0').onclick=home;
addEventListener('keydown',e=>{if(e.key=='Escape')closeDrawer()});
$('back1').onclick=openCheckin;

async function stop(){if(sc){try{await sc.stop();sc.clear()}catch(e){}sc=null}}
$('b-scan').onclick=async()=>{show('scan');sc=new Html5Qrcode('reader');
 try{await sc.start({facingMode:'environment'},{fps:10,qrbox:240},async t=>{await stop();check(t)})}
 catch(e){await stop();show('act');alert('Camera not available. Allow camera access or use Enter code.')}};
$('back2').onclick=async()=>{await stop();show('act')};
$('b-code').onclick=()=>{$('tc').value='';show('code')};$('back3').onclick=()=>show('act');
$('chk').onclick=()=>{const c=$('tc').value.trim();if(c)check(c)};
$('next').onclick=()=>show('act');

function res(color,title,msg,extra){show('resv');$('res').innerHTML=`<div class="res ${color}"><h1>${esc(title)}</h1><p>${esc(msg)}</p></div>`;if(extra)$('res').firstChild.append(extra)}
const bad={not_open:'Check-in is not open right now.',not_assigned:'You are not assigned to this session.'};

async function check(code){show('resv');$('res').innerHTML='<p>Checking...</p>';
 const{data,error}=await SB.rpc('lookup_ticket',{p_session:cur.id,p_code:code});
 if(error)return res('red','Could not check','Check your connection and scan again.');
 if(data.status=='invalid')return res('red','Invalid ticket','This code is not for this session.');
 if(data.status!='ok')return res('amber','Check-in unavailable',bad[data.status]);
 const n=data.attendees,done=data.admitted||[];
 if(n==1){if(done.length)return res('amber','Already scanned','Entered on '+T(data.last_scan,{...dt,...tm})+'.');
  const w=document.createElement('div');const y=document.createElement('button');y.textContent='Yes, admit';y.onclick=()=>admit(code,[1],n,0);
  const no=document.createElement('button');no.textContent='No';no.style.cssText='background:transparent;border:2px solid #2a1700';no.onclick=()=>show('act');
  w.append(y,no);return res('amber','Ticket for 1','Admit this person?',w)}
 if(done.length>=n)return res('amber','Ticket fully used','All '+n+' attendees have entered.');
 const w=document.createElement('div');w.style.textAlign='left';const boxes=[];
 for(let i=1;i<=n;i++){const was=done.includes(i);const l=document.createElement('label');l.className='pick'+(was?' was':'');
  const c=document.createElement('input');c.type='checkbox';c.value=i;c.checked=was;c.disabled=was;
  l.append(c,'Attendee '+i+(was?' (entered)':''));w.append(l);if(!was)boxes.push(c)}
 const b1=document.createElement('button');b1.textContent='Admit selected';
 b1.onclick=()=>{const p=boxes.filter(c=>c.checked).map(c=>+c.value);if(!p.length)return alert('Tick at least one attendee.');admit(code,p,n,done.length)};
 w.append(b1);res('amber','Ticket for '+n,done.length+' of '+n+' already entered. Tick who is entering now.',w)}

async function admit(code,nums,n,before){
 const{data,error}=await SB.rpc('admit',{p_session:cur.id,p_code:code,p_attendees:nums,p_request:crypto.randomUUID()});
 if(error)return res('red','Could not admit','Check your connection and scan again.');
 if(data.status=='already')return res('amber','Already admitted','That attendee has already entered.');
 if(data.status!='ok')return res('red','Not admitted',bad[data.status]||'Invalid ticket.');
 const left=n-before-nums.length;
 res('green','Entry allowed',n==1?code:'Attendee '+nums.join(', ')+' admitted. '+(left?left+' still to enter.':'Ticket fully used.'))}

const VERSION='5';
document.querySelectorAll('.ver').forEach(e=>e.textContent='Version '+VERSION);
fetch('version.txt?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{t=t.trim();
 if(t&&t!==VERSION&&new URLSearchParams(location.search).get('v')!==t)location.replace(location.pathname+'?v='+t)}).catch(()=>{});
SB.auth.getSession().then(({data})=>data.session?home():show('login'));
show('login');
</script></body></html>
